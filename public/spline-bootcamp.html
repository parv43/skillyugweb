<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      spline-viewer {
        width: 100%;
        height: 100%;
        display: block;
        background: transparent;
      }
    </style>
    <script>
      // Suppress specific Spline viewer errors to prevent Lighthouse audit failures
      (function() {
        const originalError = console.error;
        console.error = function(...args) {
          const msg = args[0];
          if (typeof msg === 'string' && (msg.includes("position") || msg.includes("onFrame"))) return;
          if (msg instanceof Error && msg.message.includes("position")) return;
          originalError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e.message && e.message.includes("reading 'position'")) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.90/build/spline-viewer.js"></script>
  </head>
  <body>
    <spline-viewer url="https://prod.spline.design/8-8lOfrNq9PqvlRE/scene.splinecode" loading="eager"></spline-viewer>
  </body>
</html>
